<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAC KITS</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1630; --deep:#080e21; --red:#e3262f; --red2:#b8141d; --paper:#eef0f5; --white:#fff; --steel:#8b94ab; --ink:#141a2b; --line:#d9dce5;
  --disp:'Anton',Impact,'Rubik',sans-serif; --ui:'Rubik',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--deep);color:#fff;border-bottom:3px solid var(--red)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;flex:none}
.logo b{font-family:var(--disp);font-weight:400;font-size:28px;letter-spacing:.5px;line-height:1;direction:ltr}
.logo b span{color:var(--red)}
.search{flex:1;position:relative;max-width:520px;margin-inline-start:auto}
.search input{width:100%;height:42px;border:0;border-radius:4px;padding:0 42px 0 14px;background:#1a2547;color:#fff;font-size:16px}
.search input::placeholder{color:#97a0bb}
.search svg{position:absolute;right:12px;top:11px;width:20px;height:20px;stroke:#97a0bb}
.listBtn{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:0;border-radius:4px;background:var(--red);color:#fff;font-weight:700}
.listBtn i{font-style:normal;font-family:var(--disp);font-size:20px;min-width:22px;text-align:center;line-height:1}
.listBtn.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 34px,transparent 34px 68px)}
.slash{position:absolute;top:-20%;bottom:-20%;left:9%;width:120px;background:var(--red);transform:skewX(-18deg)}
.slash.s2{left:calc(9% + 140px);width:22px;background:#fff;opacity:.9}
.hero .wrap{position:relative;padding-top:44px;padding-bottom:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end}
.word{font-family:var(--disp);font-weight:400;direction:ltr;text-align:right;line-height:.86;margin:0;font-size:clamp(76px,15vw,200px);letter-spacing:-1px}
.word .k{display:block;color:transparent;-webkit-text-stroke:2px #fff}
.hero p{margin:14px 0 0;font-size:18px;color:#c9cfe0;max-width:30em}
.count{display:flex;gap:28px;margin-top:22px}
.count div{border-top:3px solid var(--red);padding-top:6px}
.count b{display:block;font-family:var(--disp);font-weight:400;font-size:40px;line-height:1;direction:ltr;text-align:right}
.count span{font-size:14px;color:#aab2c8}
.heroShirt{justify-self:start;position:relative;width:min(300px,100%);aspect-ratio:1/1.05}
.heroShirt svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}

/* ---------- leagues rail ---------- */
.leagues{background:var(--deep);position:sticky;top:65px;z-index:20}
.rail{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;max-width:1320px;margin:0 auto}
.rail::-webkit-scrollbar{display:none}
.lg{flex:none;border:0;background:transparent;color:#aab2c8;font-weight:700;padding:8px 14px;border-radius:3px;white-space:nowrap}
.lg:hover{color:#fff}
.lg[aria-pressed=true]{background:#fff;color:var(--navy)}
.lg small{font-weight:500;opacity:.7;margin-inline-start:4px}

/* ---------- toolbar ---------- */
.tools{padding:22px 0 8px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.title h2{margin:0;font-size:30px;font-weight:900;font-style:italic;letter-spacing:-.5px}
.title span{color:#6b7389}
.teams{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:12px 0 4px}
.team{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.team[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px}
.chip{border:2px solid var(--navy);background:transparent;border-radius:3px;padding:5px 11px;font-size:14px;font-weight:700;color:var(--navy)}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.sort{margin-inline-start:auto;border:1px solid var(--line);background:#fff;border-radius:3px;padding:6px 8px;font-size:14px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px;padding:14px 0 40px}
.card{position:relative;background:#fff;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #e3e6ee}
.card .ph{position:relative;aspect-ratio:1/1;background:#f4f5f8;cursor:zoom-in;border:0;padding:0}
.card .ph img{width:100%;height:100%;object-fit:cover}
.yr{position:absolute;bottom:0;right:0;background:var(--navy);color:#fff;font-family:var(--disp);font-size:19px;line-height:1;padding:6px 9px 5px;direction:ltr}
.tag{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.tag em{font-style:normal;font-size:12px;font-weight:700;background:#fff;color:var(--navy);padding:2px 7px;border-radius:2px;box-shadow:0 1px 3px rgba(13,22,48,.18)}
.tag em.n{background:var(--red);color:#fff}
.card .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h3{margin:0;font-size:17px;font-weight:900;line-height:1.2}
.card p{margin:0;font-size:13px;color:#6b7389;direction:ltr;text-align:right;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pick{position:absolute;top:8px;left:8px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--navy);display:grid;place-items:center;box-shadow:0 2px 8px rgba(13,22,48,.25)}
.pick svg{width:20px;height:20px}
.pick[aria-pressed=true]{background:var(--red);color:#fff}
.card.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.pr{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:6px}
.pr b{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1;color:var(--navy);direction:ltr}
.pr span{font-size:12px;color:#6b7389}
.rowP{font-family:var(--disp);font-size:18px;color:var(--navy);direction:ltr;text-align:right;margin-top:6px}
.sum{display:grid;gap:3px;font-size:14px;color:#4b5369;padding-bottom:4px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:18px;font-weight:900;color:var(--ink);border-top:1px solid var(--line);padding-top:6px;margin-top:3px}
.sum small{color:#9aa1b5;font-weight:500}
.vPr{font-family:var(--disp);font-size:34px;color:var(--navy);direction:ltr;text-align:right;line-height:1}
.vPrS{font-size:13px;color:#6b7389}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:#6b7389}
.empty b{display:block;font-size:22px;color:var(--ink);margin-bottom:6px}
.more{height:1px}

/* ---------- drawer ---------- */
.shade{position:fixed;inset:0;background:rgba(8,14,33,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);background:#fff;z-index:41;transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dHead{background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--red)}
.dHead h2{margin:0;font-size:22px;font-weight:900;font-style:italic;flex:1}
.x{border:0;background:transparent;color:inherit;width:40px;height:40px;font-size:26px;line-height:1}
.dBody{flex:1;overflow-y:auto;padding:8px 16px}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.row img{width:76px;height:76px;object-fit:cover;border-radius:4px;background:#f4f5f8}
.row h4{margin:0;font-size:15px;font-weight:900}
.row p{margin:0 0 6px;font-size:12px;color:#6b7389;direction:ltr;text-align:right}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts select,.opts input{border:1px solid var(--line);border-radius:3px;padding:5px 6px;font-size:14px;background:#fff}
.opts input{width:88px}
.opts input.num{width:56px}
.rm{border:0;background:transparent;color:#9aa1b5;font-size:22px;width:32px;height:32px}
.dFoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.wa{border:0;border-radius:4px;background:#1faa52;color:#fff;font-weight:700;padding:13px;font-size:17px}
.copy{border:2px solid var(--navy);border-radius:4px;background:#fff;color:var(--navy);font-weight:700;padding:10px}
.clear{border:0;background:transparent;color:#9aa1b5;font-size:14px;padding:4px}
.dEmpty{text-align:center;color:#6b7389;padding:50px 10px}
.dEmpty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}

/* ---------- viewer ---------- */
.view{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.view.on{display:flex}
.vBox{position:relative;background:#fff;border-radius:8px;overflow:hidden;width:min(860px,100%);max-height:calc(100vh - 32px);display:grid;grid-template-columns:1.1fr 1fr}
.vBox .im{background:#f4f5f8}
.vBox .im img{width:100%;height:100%;object-fit:contain;max-height:80vh}
.vTx{padding:22px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.vTx .lgn{color:var(--red);font-weight:700;font-size:14px}
.vTx h3{margin:0;font-size:28px;font-weight:900;font-style:italic;line-height:1.1}
.vTx p{margin:0;direction:ltr;text-align:right;color:#4b5369}
.vTx .go{margin-top:auto;border:0;border-radius:4px;background:var(--red);color:#fff;font-weight:700;padding:13px;font-size:17px}
.vTx .go.on{background:var(--navy)}
.vTx a{color:var(--navy);font-size:14px}
.vBox .x{position:absolute;top:6px;left:6px;z-index:2;background:#fff;border-radius:50%;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--deep);color:#fff;padding:10px 18px;border-radius:4px;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{background:var(--deep);color:#7d86a0;font-size:13px;padding:22px 0}
.foot b{font-family:var(--disp);font-weight:400;color:#fff;font-size:20px;direction:ltr;display:inline-block}

/* ---------- phone first ---------- */
.fab{display:none}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{padding:0 12px}
  .bar .wrap{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px;row-gap:8px;gap:8px}
  .logo b{font-size:24px}
  .listBtn{margin-inline-start:auto;height:38px;padding:0 12px;font-size:15px}
  .search{order:3;flex:1 0 100%;max-width:none;margin:0}
  .search input{height:44px}
  .leagues{position:static}
  .rail{padding:8px 12px}
  .lg{padding:9px 13px;font-size:15px}
  .hero .wrap{grid-template-columns:1fr;padding-top:22px;padding-bottom:20px;gap:0}
  .word{font-size:min(29vw,128px);display:flex;gap:10px;justify-content:flex-end;align-items:baseline}
  .word .k{display:inline}
  .hero p{font-size:15px;margin-top:10px}
  .count{gap:22px;margin-top:14px}
  .count b{font-size:28px}
  .count span{font-size:13px}
  .heroShirt{display:none}
  .slash{left:-50px;width:70px}.slash.s2{left:30px;width:10px}
  .tools{padding:14px 0 4px}
  .title h2{font-size:24px}
  .teams{margin:0 -12px;padding:10px 12px 2px;scrollbar-width:none}
  .teams::-webkit-scrollbar{display:none}
  .team{padding:8px 13px;font-size:15px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:10px 12px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 12px;font-size:15px}
  .sort{flex:none;font-size:15px;padding:7px 8px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:110px}
  .card .tx{padding:8px 9px 10px}
  .card h3{font-size:15px}
  .card p{font-size:12px;-webkit-line-clamp:1}
  .pr b{font-size:20px}
  .pr span{font-size:11px}
  .yr{font-size:16px;padding:5px 7px 4px}
  .tag{top:6px;right:6px}
  .tag em{font-size:11px;padding:1px 6px}
  .pick{width:44px;height:44px;top:4px;left:4px}
  /* list drawer = full screen sheet */
  .drawer{width:100%}
  .dBody{padding:4px 12px}
  .row{grid-template-columns:64px 1fr auto;gap:8px}
  .row img{width:64px;height:64px}
  .opts select,.opts input{font-size:16px;padding:8px 6px}
  .opts input{width:110px}
  .opts input.num{width:64px}
  .rm{width:40px;height:40px}
  /* viewer = bottom sheet */
  .view{align-items:flex-end;padding:0}
  .vBox{grid-template-columns:1fr;width:100%;border-radius:14px 14px 0 0;max-height:94vh;overflow-y:auto}
  .vBox .im img{max-height:50vh}
  .vTx{padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .vTx h3{font-size:24px}
  .vBox .x{top:10px;left:10px;width:44px;height:44px}
  /* floating list bar */
  .fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;gap:10px;border:0;border-radius:8px;background:var(--red);color:#fff;padding:12px 16px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(8,14,33,.35);transform:translateY(140%);transition:transform .25s}
  .fab.on{transform:none}
  .fab i{font-style:normal;font-family:var(--disp);font-size:22px;background:#fff;color:var(--red);border-radius:4px;min-width:30px;text-align:center;padding:2px 4px;line-height:1.1}
  .fab span{flex:1;text-align:right}
  .fab b{font-family:var(--disp);font-weight:400;font-size:22px;direction:ltr}
  .toast{bottom:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="#" aria-label="NAC KITS – לראש העמוד"><b>NAC <span>KITS</span></b></a>
    <label class="search">
      <input id="q" type="search" placeholder="חפש קבוצה, נבחרת או שנה…" autocomplete="off" aria-label="חיפוש">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
    <button class="listBtn" id="openList" aria-label="הרשימה שלי"><span>הרשימה שלי</span><i id="cnt">0</i></button>
  </div>
</header>

<section class="hero">
  <i class="slash"></i><i class="slash s2"></i>
  <div class="wrap">
    <div>
      <h1 class="word">NAC<span class="k">KITS</span></h1>
      <p>כל חולצות הכדורגל במקום אחד. מסמנים מה בא לכם, בוחרים מידה ושם על הגב, ושולחים את הרשימה בוואטסאפ.</p>
      <div class="count"><div><b id="cItems">0</b><span>חולצות</span></div><div><b id="cTeams">0</b><span>קבוצות ונבחרות</span></div></div>
    </div>
    <div class="heroShirt" aria-hidden="true">
      <svg viewBox="0 0 200 210">
        <path d="M62 14 30 26 4 64l28 20 12-14v128h112V70l12 14 28-20-26-38-32-12c-4 14-18 24-38 24S66 28 62 14Z" fill="#fff"/>
        <path d="M62 14c4 14 18 24 38 24s34-10 38-24l-8-3c-4 11-15 18-30 18s-26-7-30-18Z" fill="#e3262f"/>
        <path d="M44 70v128h112V70" fill="none"/>
        <rect x="44" y="70" width="112" height="9" fill="#0d1630" opacity=".08"/>
        <text x="100" y="152" text-anchor="middle" font-family="Anton,Impact" font-size="74" fill="#0d1630">10</text>
        <text x="100" y="80" text-anchor="middle" font-family="Anton,Impact" font-size="16" fill="#0d1630" letter-spacing="2">NAC</text>
      </svg>
    </div>
  </div>
</section>

<nav class="leagues" aria-label="ליגות"><div class="rail" id="rail"></div></nav>

<main class="wrap">
  <div class="tools">
    <div class="title"><h2 id="hTitle">כל החולצות</h2><span id="hCount"></span></div>
    <div class="teams" id="teams" aria-label="קבוצות"></div>
    <div class="chips" id="chips">
      <button class="chip" data-f="new" aria-pressed="false">עונה חדשה</button>
      <button class="chip" data-f="retro" aria-pressed="false">רטרו</button>
      <button class="chip" data-f="player" aria-pressed="false">גרסת שחקן</button>
      <button class="chip" data-f="long" aria-pressed="false">שרוול ארוך</button>
      <button class="chip" data-f="kids" aria-pressed="false">ילדים</button>
      <button class="chip" data-f="women" aria-pressed="false">נשים</button>
      <button class="chip" data-f="gk" aria-pressed="false">שוער</button>
      <select class="sort" id="sort" aria-label="מיון">
        <option value="new">החדשות קודם</option>
        <option value="old">הישנות קודם</option>
        <option value="az">לפי קבוצה</option>
      </select>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="more" id="more"></div>
</main>

<footer class="foot"><div class="wrap"><b>NAC KITS</b> &nbsp;רשימת חולצות לחברים. אין כאן מכירה.</div></footer>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="הרשימה שלי" aria-hidden="true">
  <div class="dHead"><h2>הרשימה שלי</h2><button class="x" data-close aria-label="סגירה">×</button></div>
  <div class="dBody" id="dBody"></div>
  <div class="dFoot" id="dFoot">
    <div class="sum" id="sum"></div>
    <button class="wa" id="wa">שליחה בוואטסאפ</button>
    <button class="copy" id="copy">העתקת הרשימה</button>
    <button class="clear" id="clear">ניקוי הרשימה</button>
  </div>
</aside>

<div class="view" id="view" role="dialog" aria-modal="true">
  <div class="vBox">
    <button class="x" data-close aria-label="סגירה">×</button>
    <div class="im"><img id="vImg" alt=""></div>
    <div class="vTx">
      <span class="lgn" id="vLg"></span>
      <h3 id="vTeam"></h3>
      <p id="vTitle"></p>
      <div><div class="vPr" id="vPr"></div><span class="vPrS" id="vPrS"></span></div>
      <a id="vMore" target="_blank" rel="noopener">עוד תמונות של החולצה</a>
      <button class="go" id="vGo">הוספה לרשימה</button>
    </div>
  </div>
</div>
<button class="fab" id="fab" aria-label="פתיחת הרשימה שלי"><i id="fabN">0</i><span>הרשימה שלי</span><b id="fabT"></b></button>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
// ---- settings: put a phone number here (972…) to send the list straight to one person ----
const WA_PHONE = '';
const SUPPLIER = id => `https://seepro.x.yupoo.com/albums/${id}?uid=1`;

const $ = id => document.getElementById(id);
const K = window.KITS, HE = K.he;
const TAGS = { new: 'חדש', retro: 'רטרו', player: 'שחקן', kids: 'ילדים', women: 'נשים', long: 'ארוך', gk: 'שוער', training: 'אימון' };
const KIND = { home: 'בית', away: 'חוץ', third: 'שלישית' };
const cleanT = t => t.replace(/[\s,;]*(size|sz)?[:\s]*\b(XS|S|M)\s*[-–~]\s*\d?X*L\b.*$/i, '').trim() || t;
const items = K.items.map(r => ({ id: r[0], t: cleanT(r[1]), team: r[2], lg: r[3], s: r[4], y: r[5], k: r[6], tg: r[7] ? r[7].split(',') : [], n: r[8] }));
// supplier price list (USD), from the supplier's English Price List
const RATE = 3.7;
const basePrice = i => i.tg.includes('kids') ? 14 : i.tg.includes('player') ? 16 : i.tg.includes('retro') ? 15 : 12;
const SIZE_ADD = { XXL: 2, '3XL': 3, '4XL': 4 };
const rowPrice = x => { const i = byId.get(x.id); return (basePrice(i) + (SIZE_ADD[x.size] || 0) + (x.name || x.num ? 3 : 0)) * x.qty; };
const ils = d => Math.round(d * RATE);
const byId = new Map(items.map(i => [i.id, i]));
const he = t => HE[t] || t;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[׳']/g, '');
items.forEach(i => { i.key = norm(`${i.t} ${i.team} ${he(i.team)} ${i.lg} ${i.s}`); });

// ---- state ----
const st = { lg: 'הכל', team: '', f: new Set(), q: '', sort: 'new' };
let list = [];
try { list = JSON.parse(localStorage.getItem('nackits:list') || '[]').filter(x => byId.has(x.id)); } catch (e) {}
const saveList = () => { try { localStorage.setItem('nackits:list', JSON.stringify(list)); } catch (e) {} };
const inList = id => list.some(x => x.id === id);

// ---- leagues rail ----
const lgCount = {}; items.forEach(i => { lgCount[i.lg] = (lgCount[i.lg] || 0) + 1; });
const leagues = ['הכל', ...K.leagues.filter(l => lgCount[l])];
$('rail').innerHTML = leagues.map(l => `<button class="lg" data-lg="${l}" aria-pressed="${l === st.lg}"><bdi>${l}</bdi> <small>${l === 'הכל' ? items.length : lgCount[l]}</small></button>`).join('');
$('rail').onclick = e => { const b = e.target.closest('.lg'); if (!b) return; st.lg = b.dataset.lg; st.team = ''; syncRail(); renderTeams(); run(true); };
const syncRail = () => $('rail').querySelectorAll('.lg').forEach(b => b.setAttribute('aria-pressed', b.dataset.lg === st.lg));

// ---- teams ----
function renderTeams() {
  const c = {}; items.forEach(i => { if ((st.lg === 'הכל' || i.lg === st.lg) && i.team !== 'עוד') c[i.team] = (c[i.team] || 0) + 1; });
  let t = Object.entries(c).sort((a, b) => b[1] - a[1]);
  if (st.lg === 'הכל') t = t.slice(0, 40);
  $('teams').innerHTML = t.map(([n, k]) => `<button class="team" data-t="${n.replace(/"/g, '&quot;')}" aria-pressed="${n === st.team}">${he(n)}</button>`).join('');
}
$('teams').onclick = e => { const b = e.target.closest('.team'); if (!b) return; st.team = st.team === b.dataset.t ? '' : b.dataset.t; $('teams').querySelectorAll('.team').forEach(x => x.setAttribute('aria-pressed', x.dataset.t === st.team)); run(true); };
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; const f = b.dataset.f; st.f.has(f) ? st.f.delete(f) : st.f.add(f); b.setAttribute('aria-pressed', st.f.has(f)); run(true); };
$('sort').onchange = e => { st.sort = e.target.value; run(true); };
let qT; $('q').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { st.q = e.target.value.trim(); run(true); }, 160); };

// ---- results ----
let res = [], shown = 0;
const PAGE = 48;
function run(reset) {
  const words = norm(st.q).split(/\s+/).filter(Boolean);
  res = items.filter(i => (st.lg === 'הכל' || i.lg === st.lg) && (!st.team || i.team === st.team) && [...st.f].every(f => i.tg.includes(f)) && words.every(w => i.key.includes(w)));
  if (st.sort === 'new') res.sort((a, b) => b.y - a.y);
  else if (st.sort === 'old') res.sort((a, b) => (a.y || 9999) - (b.y || 9999));
  else res.sort((a, b) => he(a.team).localeCompare(he(b.team), 'he') || b.y - a.y);
  $('hTitle').textContent = st.team ? he(st.team) : st.q ? `חיפוש: ${st.q}` : st.lg === 'הכל' ? 'כל החולצות' : st.lg;
  $('hCount').textContent = `${res.length.toLocaleString('he-IL')} חולצות`;
  if (reset) { $('grid').innerHTML = ''; shown = 0; }
  if (!res.length) { $('grid').innerHTML = `<div class="empty"><b>לא מצאנו חולצה כזאת</b>נסו שם קבוצה אחר, באנגלית או בעברית, או בטלו חלק מהסינונים.</div>`; return; }
  more();
}
function card(i) {
  const tg = i.tg.filter(t => t !== 'training').slice(0, 2).map(t => `<em class="${t === 'new' ? 'n' : ''}">${TAGS[t]}</em>`).join('');
  const k = KIND[i.k] ? `<em>${KIND[i.k]}</em>` : '';
  const on = inList(i.id);
  return `<article class="card${on ? ' sel' : ''}" data-id="${i.id}">
    <button class="ph" data-view aria-label="הגדלה: ${i.t.replace(/"/g, '')}"><img src="img/${i.id}.webp" alt="" loading="lazy" decoding="async">
      <span class="tag">${tg}${k}</span>${i.s ? `<span class="yr">${i.s}</span>` : ''}</button>
    <button class="pick" data-pick aria-pressed="${on}" aria-label="${on ? 'הסרה מהרשימה' : 'הוספה לרשימה'}">${on ? CHECK : PLUS}</button>
    <div class="tx"><h3>${he(i.team) === 'עוד' ? 'חולצה' : he(i.team)}</h3><p>${i.t}</p><div class="pr"><b>$${basePrice(i)}</b><span>בערך ${ils(basePrice(i))} ₪ אצל הספק</span></div></div></article>`;
}
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
function more() {
  if (shown >= res.length) return;
  $('grid').insertAdjacentHTML('beforeend', res.slice(shown, shown + PAGE).map(card).join(''));
  shown += PAGE;
}
new IntersectionObserver(es => { if (es[0].isIntersecting) more(); }, { rootMargin: '900px' }).observe($('more'));

// ---- pick / view ----
$('grid').onclick = e => {
  const c = e.target.closest('.card'); if (!c) return;
  if (e.target.closest('[data-pick]')) toggle(c.dataset.id);
  else if (e.target.closest('[data-view]')) openView(c.dataset.id);
};
function toggle(id) {
  if (inList(id)) list = list.filter(x => x.id !== id);
  else { list.push({ id, size: 'L', name: '', num: '', qty: 1 }); toast('נוספה לרשימה'); $('openList').classList.remove('bump'); void $('openList').offsetWidth; $('openList').classList.add('bump'); }
  saveList(); syncCard(id); updCount(); if ($('drawer').classList.contains('on')) renderList();
  if (vId === id) syncView();
}
function syncCard(id) {
  const c = $('grid').querySelector(`.card[data-id="${id}"]`); if (!c) return;
  const on = inList(id), b = c.querySelector('.pick');
  c.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); b.innerHTML = on ? CHECK : PLUS; b.setAttribute('aria-label', on ? 'הסרה מהרשימה' : 'הוספה לרשימה');
}
const updCount = () => { $('cnt').textContent = list.length; $('fabN').textContent = list.length; $('fabT').textContent = list.length ? '$' + totals().all : ''; $('fab').classList.toggle('on', list.length > 0 && !$('drawer').classList.contains('on')); };
let vId = null;
function openView(id) {
  const i = byId.get(id); vId = id;
  $('vImg').src = `img/${id}.webp`; $('vImg').alt = i.t;
  $('vLg').textContent = [i.lg === 'עוד' ? '' : i.lg, KIND[i.k] ? `חולצת ${KIND[i.k]}` : '', i.s].filter(Boolean).join('  /  ');
  $('vTeam').textContent = he(i.team) === 'עוד' ? 'חולצה' : he(i.team); $('vTitle').textContent = i.t;
  $('vPr').textContent = '$' + basePrice(i); $('vPrS').textContent = `בערך ${ils(basePrice(i))} ₪ אצל הספק. שם ומספר על הגב +$3, מידה XXL ומעלה +$2 עד $4`;
  $('vMore').href = SUPPLIER(id); $('vMore').textContent = i.n > 1 ? `עוד ${i.n} תמונות של החולצה` : 'פתיחה אצל הספק';
  syncView(); $('view').classList.add('on'); $('shade').classList.add('on'); $('vGo').focus();
}
function syncView() { const on = inList(vId); $('vGo').textContent = on ? 'ברשימה. להסיר?' : 'הוספה לרשימה'; $('vGo').classList.toggle('on', on); }
$('vGo').onclick = () => toggle(vId);

// ---- drawer ----
const SIZES = ['S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL'], KSIZES = ['16', '18', '20', '22', '24', '26', '28'];
function renderList() {
  const fo = $('dFoot');
  if (!list.length) { $('dBody').innerHTML = `<div class="dEmpty"><b>הרשימה ריקה</b>לוחצים על הפלוס שעל חולצה כדי להוסיף אותה לכאן.</div>`; fo.style.display = 'none'; return; }
  fo.style.display = '';
  $('dBody').innerHTML = list.map((x, n) => { const i = byId.get(x.id), kid = i.tg.includes('kids'), sz = kid ? KSIZES : SIZES;
    return `<div class="row" data-n="${n}"><img src="img/${i.id}.webp" alt="">
      <div><h4>${he(i.team) === 'עוד' ? 'חולצה' : he(i.team)}</h4><p>${i.t}</p>
        <div class="opts">
          <select data-k="size" aria-label="מידה">${sz.map(s => `<option${s === x.size ? ' selected' : ''}>${s}</option>`).join('')}</select>
          <input data-k="name" placeholder="שם על הגב" maxlength="14" value="${x.name.replace(/"/g, '')}" aria-label="שם על הגב">
          <input class="num" data-k="num" placeholder="מס׳" inputmode="numeric" maxlength="2" value="${x.num}" aria-label="מספר">
          <select data-k="qty" aria-label="כמות">${[1, 2, 3, 4, 5].map(q => `<option value="${q}"${q === x.qty ? ' selected' : ''}>×${q}</option>`).join('')}</select>
        </div><div class="rowP" data-p>$${rowPrice(x)}</div></div>
      <button class="rm" data-rm aria-label="הסרה">×</button></div>`; }).join('');
  renderSum();
}
$('dBody').oninput = e => { const r = e.target.closest('.row'), k = e.target.dataset.k; if (!r || !k) return; const x = list[+r.dataset.n]; x[k] = k === 'qty' ? +e.target.value : e.target.value.trim(); saveList(); updCount(); r.querySelector('[data-p]').textContent = '$' + rowPrice(x); renderSum(); };
$('dBody').onchange = $('dBody').oninput;
function totals() { const units = list.reduce((a, x) => a + x.qty, 0), items = list.reduce((a, x) => a + rowPrice(x), 0); const ship = units >= 3 ? 0 : units === 2 ? 6 : units === 1 ? 4 : 0; return { units, items, ship, all: items + ship }; }
function renderSum() { const t = totals(); $('sum').innerHTML = `<div><span>${t.units} חולצות</span><span>$${t.items}</span></div><div><span>משלוח</span><span>${t.ship ? '$' + t.ship : 'חינם'}</span></div><div class="tot"><span>סה״כ אצל הספק</span><span>$${t.all} <small>(בערך ${ils(t.all)} ₪)</small></span></div>${t.units < 3 ? '<small>מ-3 חולצות המשלוח חינם</small>' : ''}`; }
$('dBody').onclick = e => { if (!e.target.closest('[data-rm]')) return; const x = list[+e.target.closest('.row').dataset.n]; toggle(x.id); };
function listText() {
  return 'הרשימה שלי מ-NAC KITS:\n\n' + list.map((x, n) => { const i = byId.get(x.id);
    return `${n + 1}. ${i.t}\n   מידה ${x.size}${x.qty > 1 ? `, ${x.qty} יחידות` : ''}${x.name || x.num ? `, על הגב: ${[x.name, x.num].filter(Boolean).join(' ')}` : ''}\n   ${SUPPLIER(x.id)}\n   $${rowPrice(x)}`; }).join('\n\n') + (() => { const t = totals(); return `\n\nמשלוח: ${t.ship ? '$' + t.ship : 'חינם'}\nסה״כ אצל הספק: $${t.all} (בערך ${ils(t.all)} ₪)`; })();
}
$('wa').onclick = () => open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(listText())}`, '_blank');
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(listText()); toast('הרשימה הועתקה'); } catch (e) { toast('לא הצלחנו להעתיק'); } };
$('clear').onclick = () => { if (!confirm('לנקות את כל הרשימה?')) return; const ids = list.map(x => x.id); list = []; saveList(); ids.forEach(syncCard); updCount(); renderList(); };
$('fab').onclick = () => $('openList').click();
$('openList').onclick = () => { $('fab').classList.remove('on'); renderList(); $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false'); $('shade').classList.add('on'); };
function closeAll() { $('drawer').classList.remove('on'); setTimeout(updCount, 0); $('drawer').setAttribute('aria-hidden', 'true'); $('view').classList.remove('on'); $('shade').classList.remove('on'); vId = null; }
document.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === $('shade') || e.target === $('view')) closeAll(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
let tT; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 1500); }

// ---- go ----
$('cItems').textContent = items.length.toLocaleString('en-US');
$('cTeams').textContent = new Set(items.map(i => i.team)).size.toLocaleString('en-US');
updCount(); renderTeams(); run(true);
</script>
</body>
</html>
